name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --locked
      - name: ADR invariants and generated rules (INV-0000-1, INV-0000-2)
        id: adr
        run: |
          uv run python scripts/check_invariants.py
          uv run python scripts/gen_adr_rules.py --check
      - name: Ruff lint and format (INV-0007-3)
        id: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright, strict for src/ (INV-0007-2)
        id: pyright
        run: uv run pyright
      - name: Import-linter contracts (INV-0007-4, INV-0001-1, INV-0001-2)
        id: import-linter
        run: uv run lint-imports
      - name: Tests
        id: tests
        run: uv run pytest
